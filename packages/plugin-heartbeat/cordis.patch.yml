# Bundle layer: applied after every bundle in `dsh.profile.bundles` and below the
# profile's own cordis.patch.yml, $DSH_HOME/cordis.patch.yml and any --patch
# overlay — so a deployment that wants another value overrides it there instead
# of forking this package.
#
# typert-gateway is the entry id @deepseek-ai/dsh-api-gateway carries in the
# dsh-base bundle; the `name` assertion keeps this entry pointed at that plugin.
- id: typert-gateway
  name: "@deepseek-ai/dsh-api-gateway"
  config:
    # Default 2000. The Host pings at this interval and terminates a socket that
    # has missed MAX_MISSED_HEARTBEATS (2) of them, so the default tolerates only
    # ~4-6s of network stall before the UI's mux socket dies and the client
    # reconnects; 30000 tolerates ~60-90s.
    websocketHeartbeatIntervalMs: 30000

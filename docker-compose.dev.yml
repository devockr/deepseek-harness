# Dev overlay: the browser settings, for running the `:dev` image.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --no-build
#
# Neither variable does anything in the published image, which has no browser libraries on purpose.
services:
  dsh:
    # Select the image: the base service builds the published Dockerfile, which has no browsers.
    image: deepseek-harness-dsh:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      # Where the browsers live. They are in no image, and this path is inside the state
      # directory, so a container rebuild re-uses them instead of downloading them again.
      - PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-/home/app/.dsh/cache/ms-playwright}
      # Browser binaries come from Playwright's CDN, which is slow on some networks. This is the
      # public npmmirror of the same builds — the host NPM_REGISTRY already defaults to in both
      # Dockerfiles. Point it elsewhere, or drop the line, if you prefer.
      - PLAYWRIGHT_DOWNLOAD_HOST=${PLAYWRIGHT_DOWNLOAD_HOST:-https://cdn.npmmirror.com/binaries/playwright}

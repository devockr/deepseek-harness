name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A publish that has started has to finish: cancelling it can leave some packages on npm and the
  # rest not.
  cancel-in-progress: false

# Least privilege at the top; a job asks for what it needs.
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # `id-token` is what npm's trusted publishing uses, so publishing needs no NPM_TOKEN; `contents`
      # and `pull-requests` are what the version commit and the "Version Packages" pull request need.
      contents: write
      id-token: write
      pull-requests: write
    # What the image job waits on: changesets' own npm result, and the image's version, which a
    # release can move without publishing anything — `image/` is private.
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
      released: ${{ steps.image-version.outputs.released }}
      version: ${{ steps.image-version.outputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets writes each changelog from the commits since the last release, and the version
          # this push releases is read from the commit before it.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # The image's version is `image/package.json`, bumped by a changeset like any other release.
      # A release that only moves it publishes nothing, so `published` cannot be the only signal.
      - name: Read the image version this push releases
        id: image-version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          now=$(jq -r .version image/package.json)
          before=$(git show "$BEFORE:image/package.json" 2>/dev/null | jq -r .version || true)
          {
            echo "version=$now"
            if [ -n "$before" ] && [ "$now" != "$before" ]; then
              echo "released=true"
            else
              echo "released=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: release package(s)'
          pr-title: 'chore: release package(s)'
          # `pnpm release` is `changeset publish`, whose `pnpm publish` runs each package's
          # `prepack`, so a published tarball always carries a fresh `lib/`.
          publish-script: pnpm release
          version-script: pnpm run version

  image:
    name: Publish the image
    needs: release
    # Changesets decides this, through its own results: the release either published packages or moved
    # the image's version. Either way `Dockerfile` names versions that are now on the registry, which
    # is what the build that installs them needs.
    if: needs.release.outputs.published == 'true' || needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    # `contents` is the top-level grant; this job adds the package it writes.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A Docker Hub access token, not the account password, in `DOCKERHUB_TOKEN`. Both logins happen
      # before the build on purpose: a missing one fails the job, rather than leaving one registry a
      # release behind the other.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` and the commit always; the version only when this release moved it, so a version tag
      # is never rewritten by a release that did not. Both registries carry the same set.
      - name: Work out the tags
        id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
          RELEASED: ${{ needs.release.outputs.released }}
        run: |
          {
            for image in ghcr.io/devockr/idsh docker.io/devockr/idsh; do
              echo "$image:latest"
              echo "$image:sha-${GITHUB_SHA}"
              if [ "$RELEASED" = 'true' ]; then
                echo "$image:${VERSION}"
              fi
            done
          } > "$RUNNER_TEMP/tags"
          {
            echo 'tags<<TAGS'
            cat "$RUNNER_TEMP/tags"
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Record what was published
        env:
          PUBLISHED: ${{ needs.release.outputs.published-packages }}
        run: |
          {
            echo '### Published by this release'
            if [ -n "$PUBLISHED" ]; then
              echo '```json'
              echo "$PUBLISHED"
              echo '```'
            else
              echo 'No packages — the image version moved.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The published image is `Dockerfile`'s final stage: the base plus the profile baked from the
      # registry. `:base` is a stage for this image and the dev one, not an image of its own.
      # linux/amd64 is the architecture of the deployments; add `,linux/arm64` when one needs it.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          # The image is attested the way the packages are.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A publish that has started has to finish: cancelling it can leave some packages on npm and the
  # rest not.
  cancel-in-progress: false

# Least privilege at the top; a job asks for what it needs.
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # `id-token` is what npm's trusted publishing uses, so publishing needs no NPM_TOKEN; `contents`
      # and `pull-requests` are what the version commit and the "Version Packages" pull request need.
      contents: write
      id-token: write
      pull-requests: write
    # `published` is what the job summary reports; `released`/`version` are the image's own version,
    # and that is what releases the image — `image/` is private, so an image-only release publishes
    # nothing to npm.
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
      released: ${{ steps.image-version.outputs.released }}
      version: ${{ steps.image-version.outputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets writes each changelog from the commits since the last release, and the version
          # this push releases is read from the commit before it.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # The image's version is `image/package.json`, bumped by a changeset like any other release.
      # A release that only moves it publishes nothing, so `published` cannot be the only signal.
      - name: Read the image version this push releases
        id: image-version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          now=$(jq -r .version image/package.json)
          before=$(git show "$BEFORE:image/package.json" 2>/dev/null | jq -r .version || true)
          {
            echo "version=$now"
            if [ -n "$before" ] && [ "$now" != "$before" ]; then
              echo "released=true"
            else
              echo "released=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: release package(s)'
          pr-title: 'chore: release package(s)'
          # `pnpm release` is `changeset publish`, whose `pnpm publish` runs each package's
          # `prepack`, so a published tarball always carries a fresh `lib/`.
          publish-script: pnpm release
          version-script: pnpm run version

  image:
    name: Publish the image
    needs: release
    # The image is released when its own version moves, and only then — `ci.yml` makes sure every
    # changeset that changes what the image bakes moves it. By this point the packages `Dockerfile`
    # names are on the registry, which is what the build that installs them needs.
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    # The arm64 half is emulated, so this is minutes of apt, npm and `dsh plugin add`; a build that
    # deadlocks under QEMU should fail rather than sit on the default six-hour budget.
    timeout-minutes: 60
    # `contents` is the top-level grant; this job adds the package it writes.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is built on an amd64 runner, so the emulators its RUN steps need are registered first.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A Docker Hub access token, not the account password, in `DOCKERHUB_TOKEN`. Both logins happen
      # before the build on purpose: a missing one fails the job, rather than leaving one registry a
      # release behind the other.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Both registries carry the same three tags. The job only runs when the version moved, so the
      # version tag always names the build it is attached to.
      - name: Work out the tags
        id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          {
            for image in ghcr.io/devockr/idsh docker.io/devockr/idsh; do
              echo "$image:latest"
              echo "$image:sha-${GITHUB_SHA}"
              echo "$image:${VERSION}"
            done
          } > "$RUNNER_TEMP/tags"
          {
            echo 'tags<<TAGS'
            cat "$RUNNER_TEMP/tags"
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Record what was published
        env:
          PUBLISHED: ${{ needs.release.outputs.published-packages }}
        run: |
          {
            echo '### What this release published'
            if [ -n "$PUBLISHED" ]; then
              echo '```json'
              echo "$PUBLISHED"
              echo '```'
            else
              echo 'No packages — the image version moved.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The published image is `Dockerfile`'s final stage: the base plus the profile baked from the
      # registry. `:base` is a stage for this image and the dev one, not an image of its own.
      # One manifest list for both architectures the deployments use; the arm64 half runs under QEMU,
      # so it is the slow half of the build.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          # The image is attested the way the packages are.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Publish Any Commit

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; packing reads the tree, and the install runs dependency code.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # `pkg-pr-new` is a devDependency, not `pnpm dlx`: it asks to be run from the lockfile in CI.
      # `--pnpm` packs with pnpm, and a package's `prepack` builds `lib/` into the tarball.
      - name: Publish
        run: pnpm exec pkg-pr-new publish --pnpm --packageManager=pnpm './packages/*'

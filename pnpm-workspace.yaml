# The image needs exactly one file from this tree (entrypoint.sh), so the
# workspace is purely for the companion plugins under packages/ — see README.
packages:
  - packages/*
allowBuilds:
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@1stg/eslint-config@10.3.2'
  - '@deepseek-ai/cordis@4.0.5-alpha.2'
  - '@deepseek-ai/cosmokit@1.8.6-alpha.2'
  - '@deepseek-ai/dsh-api-gateway@0.2.1-alpha.3'
  - '@deepseek-ai/dsh-brand@0.2.1-alpha.3'
  - '@deepseek-ai/dsh-client-connection@0.2.1-alpha.3'
  - '@deepseek-ai/dsh-client-modules@0.2.1-alpha.3'
  - '@deepseek-ai/dsh-credentials@0.2.1-alpha.3'
  - '@deepseek-ai/dsh-deque@0.2.1-alpha.3'
  - '@deepseek-ai/dsh-scope@0.2.1-alpha.3'
  - '@deepseek-ai/dsh-timeout@0.2.1-alpha.3'
  - '@deepseek-ai/dsh-typert-protocol@0.2.1-alpha.3'
  - '@deepseek-ai/schemastery@3.18.5-alpha.2'

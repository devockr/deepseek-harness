# The image needs exactly one file from this tree (entrypoint.sh), so the
# workspace is purely for the companion plugins under packages/ — see README.
packages:
  - packages/*
allowBuilds:
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@1stg/eslint-config@10.3.2'
  - '@deepseek-ai/cordis@4.0.5-alpha.2'
  - '@deepseek-ai/cosmokit@1.8.6-alpha.2'
  - '@deepseek-ai/dsh*'
  - '@deepseek-ai/schemastery@3.18.5-alpha.2'
